<!DOCTYPE html>
<html lang="pt-BR">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini projeto Vue.js</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <link rel="stylesheet" href="../CSS/app.css">
    </head>
    
    <body>

    <div id="app">
        <div class="produto">

            <h1>{{ nomeproduto }}</h1>

            <p>Preço: {{ precoFormatado }}</p>

            <p>Estoque: {{ estoque }} unidades</p>

            <p v-if="estoque <= 3" class="aviso">
                Últimas unidades
            </p>

            <button @click="alterarProduto">
                Trocar produto
            </button>

            <label>Quantidade:</label>

            <input type="number" v-model.number="quantidade" min="1">

            <p>
                Total:
                <strong>{{ totalFormatado }}</strong>
            </p>

            <button @click="aplicarDesconto">
                {{ descontoAtivo ? 'Remover desconto' : 'Aplicar desconto' }}
            </button>

            <button @click="comprarproduto" :disabled="quantidade > estoque">
                Comprar
            </button>

            <p v-if="descontoAtivo">
                Desconto de 15% aplicado.
            </p>

            <p v-if="mensagemcompra">
                {{ mensagemcompra }}
            </p>

            <p v-show="quantidade > estoque" class="aviso">
                Quantidade maior que o estoque disponível.
            </p>

        </div>
    </div>


    <script src="../JS/script.js"></script>
</body>

</html>
